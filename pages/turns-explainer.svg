<svg xmlns="http://www.w3.org/2000/svg" width="680" height="262" viewBox="0 0 680 262" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Quarter turn, half turn and mirror compared</title><desc>Four small grids. Each shows the arrows i-hat and j-hat and a letter F. Start: F upright. Quarter turn: F rotated 90 degrees to the left. Half turn: F upside down, i-hat points left and j-hat points down. Mirror: F flipped left to right.</desc><style>
.bg{fill:#ffffff}
.box{fill:#f7f6f2;stroke:#c9c7bd;stroke-width:.5}
.fig{fill:#eeedfe;stroke:#534ab7;stroke-width:.5}
.axis{stroke:#d3d1c7;stroke-width:1}
.hi{stroke:#ba7517}
.th{font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f1e1c}
.ts{font:400 12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#5f5e5a}
.th.lab-i{fill:#0f6e56}.th.lab-j{fill:#993556}
@media (prefers-color-scheme:dark){
.bg{fill:#1f1e1c}.box{fill:#2c2c2a;stroke:#5f5e5a}.fig{fill:#3c3489;stroke:#afa9ec}.axis{stroke:#5f5e5a}.hi{stroke:#ef9f27}
.th{fill:#f1efe8}.ts{fill:#b4b2a9}.th.lab-i{fill:#5dcaa5}.th.lab-j{fill:#ed93b1}}
</style><rect class="bg" width="680" height="262" rx="12"/><defs><marker id="head-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="head-j" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D4537E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="box" x="40" y="40" width="140" height="140" rx="8"/><line class="axis" x1="48" y1="110" x2="172" y2="110"/><line class="axis" x1="110" y1="48" x2="110" y2="172"/><rect class="fig" x="118" y="58" width="8" height="44"/><rect class="fig" x="126" y="58" width="24" height="8"/><rect class="fig" x="126" y="74" width="16" height="8"/><line x1="110" y1="110" x2="150" y2="110" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#head-i)"/><line x1="110" y1="110" x2="110" y2="70" stroke="#D4537E" stroke-width="2.5" marker-end="url(#head-j)"/><text class="th lab-i" x="150" y="124" text-anchor="middle" dominant-baseline="central">î</text><text class="th lab-j" x="96" y="70" text-anchor="middle" dominant-baseline="central">ĵ</text><text class="th" x="110" y="202" text-anchor="middle">Start</text><text class="ts" x="110" y="221" text-anchor="middle">nothing moved</text><text class="ts" x="110" y="239" text-anchor="middle">î right, ĵ up</text><rect class="box" x="193" y="40" width="140" height="140" rx="8"/><line class="axis" x1="201" y1="110" x2="325" y2="110"/><line class="axis" x1="263" y1="48" x2="263" y2="172"/><rect class="fig" x="211" y="94" width="44" height="8"/><rect class="fig" x="211" y="70" width="8" height="24"/><rect class="fig" x="227" y="78" width="8" height="16"/><line x1="263" y1="110" x2="263" y2="70" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#head-i)"/><line x1="263" y1="110" x2="223" y2="110" stroke="#D4537E" stroke-width="2.5" marker-end="url(#head-j)"/><text class="th lab-i" x="277" y="70" text-anchor="middle" dominant-baseline="central">î</text><text class="th lab-j" x="223" y="124" text-anchor="middle" dominant-baseline="central">ĵ</text><text class="th" x="263" y="202" text-anchor="middle">Quarter turn</text><text class="ts" x="263" y="221" text-anchor="middle">90°</text><text class="ts" x="263" y="239" text-anchor="middle">î up, ĵ left</text><rect class="box" x="346" y="40" width="140" height="140" rx="8"/><rect class="hi" x="343" y="37" width="146" height="146" rx="10" fill="none" stroke-width="1.5"/><line class="axis" x1="354" y1="110" x2="478" y2="110"/><line class="axis" x1="416" y1="48" x2="416" y2="172"/><rect class="fig" x="400" y="118" width="8" height="44"/><rect class="fig" x="376" y="154" width="24" height="8"/><rect class="fig" x="384" y="138" width="16" height="8"/><line x1="416" y1="110" x2="376" y2="110" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#head-i)"/><line x1="416" y1="110" x2="416" y2="150" stroke="#D4537E" stroke-width="2.5" marker-end="url(#head-j)"/><text class="th lab-i" x="376" y="96" text-anchor="middle" dominant-baseline="central">î</text><text class="th lab-j" x="430" y="150" text-anchor="middle" dominant-baseline="central">ĵ</text><text class="th" x="416" y="202" text-anchor="middle">Half turn</text><text class="ts" x="416" y="221" text-anchor="middle">180°</text><text class="ts" x="416" y="239" text-anchor="middle">î left, ĵ down</text><rect class="box" x="499" y="40" width="140" height="140" rx="8"/><line class="axis" x1="507" y1="110" x2="631" y2="110"/><line class="axis" x1="569" y1="48" x2="569" y2="172"/><rect class="fig" x="553" y="58" width="8" height="44"/><rect class="fig" x="529" y="58" width="24" height="8"/><rect class="fig" x="537" y="74" width="16" height="8"/><line x1="569" y1="110" x2="529" y2="110" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#head-i)"/><line x1="569" y1="110" x2="569" y2="70" stroke="#D4537E" stroke-width="2.5" marker-end="url(#head-j)"/><text class="th lab-i" x="529" y="124" text-anchor="middle" dominant-baseline="central">î</text><text class="th lab-j" x="583" y="70" text-anchor="middle" dominant-baseline="central">ĵ</text><text class="th" x="569" y="202" text-anchor="middle">Mirror</text><text class="ts" x="569" y="221" text-anchor="middle">flip left to right</text><text class="ts" x="569" y="239" text-anchor="middle">î left, ĵ up</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
