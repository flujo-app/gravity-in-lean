name = "GravityInLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GravityInLean", "Audit"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "GravityInLean"

# The judge: fails the build if any result rests on a hole or an extra assumption.
[[lean_lib]]
name = "Audit"

# The question for `lake comparator` (see `comparator.json`): the headline statements with a hole
# in place of each proof. Not a default target and imported by nothing, so `lake build` and the
# audit never see it.
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"
